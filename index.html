<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ターゲット1900</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="msg" hidden></div>

<!-- ホーム -->
<section id="home"><div id="homeStat"></div><div class="hgrid">
  <button class="hb" data-go="all"><span class="c"><svg class="ico" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2zM12 6v14"/></svg></span>1900</button>
  <button class="hb" data-go="toc"><span class="c"><svg class="ico" viewBox="0 0 24 24"><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/><path d="M9 6h11M9 12h11M9 18h11"/></svg></span>目次</button>
  <button class="hb" data-go="range"><span class="c"><svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></span>範囲選択</button>
  <button class="hb" data-go="mylist"><span class="c"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="15" width="16" height="4" rx="1"/><rect x="6" y="10" width="13" height="4" rx="1"/><rect x="5" y="5" width="14" height="4" rx="1"/></svg></span>マイリスト</button>
  <button class="hb" data-go="card"><span class="c"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="15" rx="3" transform="rotate(-10 9.5 13.5)"/><rect x="9" y="3" width="13" height="15" rx="3" transform="rotate(10 15.5 10.5)" fill="#fff"/></svg></span>フラッシュカード</button>
  <button class="hb" data-go="test"><span class="c"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></span>テスト</button>
</div>
  <button class="lnk" id="bkBtn">バックアップ</button>
</section>

<!-- 目次 -->
<section id="tocScr">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl">目次</b></div>
  <nav id="toc"></nav>
</section>

<!-- マイリスト -->
<section id="mlScr">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl">マイリスト</b></div>
  <div id="mlList"></div>
</section>

<!-- 範囲選択 -->
<section id="rsScr">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl">範囲選択</b></div>
  <div class="rsp" id="rs0"><button class="big" id="b1">パート・セクションで範囲選択</button><button class="big" id="b2">単語番号で範囲選択</button></div>
  <div class="rsp" id="rs1"><div id="rs1c"></div><div class="foot"><div class="cnt" id="cnt1"></div><button class="main" id="go1">範囲選択</button></div></div>
  <div class="rsp" id="rs2"><div class="gt">単語番号</div><div class="rg"><input class="num" id="lo" type="number" inputmode="numeric" min="1" max="1900" value="1"> ～ <input class="num" id="hi" type="number" inputmode="numeric" min="1" max="1900" value="1900"></div><div class="foot"><div class="cnt" id="cnt2"></div><button class="main" id="go2">範囲選択</button></div></div>
</section>

<!-- フラッシュカード一覧 -->
<section id="fcScr">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl">フラッシュカード</b></div>
  <div id="fcList"></div>
</section>

<!-- フラッシュカード本体 -->
<section id="fcPlay">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl" id="fcProg"></b></div>
  <div id="fcArea">
    <div id="fcCard"><div id="fcFace"></div><div class="ctags" id="fcTags"></div></div>
    <div id="fcEnd" hidden></div>
  </div>
  <div class="fcnote" id="fcNote">タップでめくる<br>←前　次→</div>
</section>

<!-- テスト一覧 -->
<section id="tsScr">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl">テスト</b></div>
  <div id="tsList"></div>
</section>

<!-- テスト本体 -->
<section id="tsPlay">
  <div class="bar"><button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button><b class="ttl" id="tsProg"></b></div>
  <div id="tsBody"><div class="qbox" id="tsQ"></div><div id="tsA"></div><div id="tsFb"></div></div>
  <div id="tsEnd" hidden></div>
</section>

<!-- 閲覧（1900・目次から選んだ範囲） -->
<main id="view">
  <div class="bar">
    <button class="back" aria-label="戻る"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16M12 4l-8 8 8 8"/></svg></button>
    <b class="ttl" id="ttl"></b>
    <div id="sb">
      <button id="mg" aria-label="検索方法"><svg class="ico" viewBox="0 0 24 24" style="width:20px;height:20px"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
      <input id="q" type="text" placeholder="検索" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="clr" aria-label="消去" hidden>×</button>
    </div>
    <button class="ib" id="addBtn" aria-label="マイリストに追加する"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" id="sheetBtn" aria-label="赤シート"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="#ff3333" stroke="#ff3333"/><path d="M9 9h6M9 13h6" stroke="#fff"/></svg></button>
  </div>
  <div class="wrap"><table id="tbl"><tbody id="body"></tbody></table></div>
</main>

<!-- 虫眼鏡のプルダウン -->
<div id="pop" hidden>
  <div class="pi" data-t="head"><span class="ck"></span>見出し語検索</div>
  <div class="pi" data-t="mean"><span class="ck"></span>意味検索</div>
  <div class="pi">検索オプション<span class="ar">›</span></div>
  <div id="sub" hidden>
    <div class="pi" data-m="prefix"><span class="ck"></span>前方一致</div>
    <div class="pi" data-m="suffix"><span class="ck"></span>後方一致</div>
    <div class="pi" data-m="part"><span class="ck"></span>部分一致</div>
  </div>
</div>
<script src="app.js?v=6"></script>
</body>
</html>
